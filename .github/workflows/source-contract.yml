name: source-contract-static

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format Rust source-contract checker
        run: cargo fmt --manifest-path tools/source-contract-check/Cargo.toml -- --check
      - name: Lint Rust source-contract checker
        run: cargo clippy --manifest-path tools/source-contract-check/Cargo.toml --all-targets -- -D warnings
      - name: Self-test source checker against adversarial edits
        run: cargo test --manifest-path tools/source-contract-check/Cargo.toml
      - name: Check source style and explicit mutable receivers
        run: cargo run --quiet --manifest-path tools/source-contract-check/Cargo.toml
