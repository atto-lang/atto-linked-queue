name: source-contract-static

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the source checker against adversarial edits
        run: python3 -m unittest discover -s tests -p 'test_source_checker.py' -v
      - name: Check source style and explicit mutable receivers
        run: python3 scripts/check_source_contract.py
